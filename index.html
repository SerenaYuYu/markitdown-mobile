<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MarkItDown 轉換工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f2f2f7;
    color: #1c1c1e;
    min-height: 100vh;
  }

  header {
    background: #fff;
    padding: 16px 20px;
    border-bottom: 1px solid #e5e5ea;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 { font-size: 18px; font-weight: 600; }
  header p { font-size: 13px; color: #8e8e93; margin-top: 2px; }

  main {
    padding: 16px;
    max-width: 700px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: #8e8e93;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .drop-zone {
    border: 2px dashed #c7c7cc;
    border-radius: 10px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
  }

  .drop-zone.dragover { border-color: #007aff; background: #f0f6ff; }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-zone .icon { font-size: 40px; margin-bottom: 8px; }
  .drop-zone .label { font-size: 16px; font-weight: 500; color: #007aff; }
  .drop-zone .sublabel { font-size: 13px; color: #8e8e93; margin-top: 4px; }

  .file-info {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: #f2f2f7;
    border-radius: 8px;
    margin-top: 12px;
  }

  .file-info .name {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-info .remove {
    color: #ff3b30;
    font-size: 20px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 4px;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-bottom: 10px;
  }

  .btn:active { opacity: 0.7; }
  .btn-primary { background: #007aff; color: #fff; }
  .btn-primary:disabled { background: #c7c7cc; cursor: not-allowed; }
  .btn-success { background: #34c759; color: #fff; }
  .btn-secondary { background: #f2f2f7; color: #007aff; border: 1px solid #e5e5ea; }

  .progress {
    display: none;
    height: 4px;
    background: #e5e5ea;
    border-radius: 2px;
    overflow: hidden;
    margin: 12px 0;
  }

  .progress .fill {
    height: 100%;
    background: #007aff;
    border-radius: 2px;
    animation: prog 1.5s ease-in-out infinite;
  }

  @keyframes prog {
    0% { width: 0%; margin-left: 0; }
    50% { width: 70%; margin-left: 15%; }
    100% { width: 0%; margin-left: 100%; }
  }

  .status {
    text-align: center;
    font-size: 14px;
    color: #8e8e93;
    margin: 8px 0;
    min-height: 20px;
  }

  .status.error { color: #ff3b30; }
  .status.success { color: #34c759; }

  .result { display: none; }

  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .stat {
    background: #f2f2f7;
    border-radius: 8px;
    padding: 8px 12px;
    flex: 1;
    text-align: center;
  }

  .stat .val { font-size: 18px; font-weight: 700; color: #007aff; }
  .stat .lbl { font-size: 11px; color: #8e8e93; margin-top: 2px; }

  textarea {
    width: 100%;
    min-height: 220px;
    padding: 12px;
    border: 1px solid #e5e5ea;
    border-radius: 8px;
    font-family: "Menlo", "Monaco", monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
    background: #f9f9f9;
    color: #1c1c1e;
    margin-bottom: 12px;
  }

  .formats { display: flex; flex-wrap: wrap; gap: 6px; }

  .tag {
    background: #f2f2f7;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    color: #636366;
  }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #1c1c1e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>MarkItDown 轉換工具</h1>
  <p>將檔案轉換為 Markdown 格式</p>
</header>

<main>
  <div class="card">
    <div class="card-title">選擇檔案</div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput"
        accept=".pdf,.docx,.txt,.md,.csv,.html,.htm,.json,.xml">
      <div class="icon">📄</div>
      <div class="label">點此選擇檔案</div>
      <div class="sublabel">支援 PDF、Word、TXT、CSV、HTML 等</div>
    </div>
    <div class="file-info" id="fileInfo">
      <span>📎</span>
      <span class="name" id="fileName"></span>
      <button class="remove" onclick="clearFile()">✕</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">支援格式</div>
    <div class="formats">
      <span class="tag">PDF</span>
      <span class="tag">Word (.docx)</span>
      <span class="tag">TXT</span>
      <span class="tag">CSV</span>
      <span class="tag">HTML</span>
      <span class="tag">JSON</span>
      <span class="tag">XML</span>
      <span class="tag">Markdown</span>
    </div>
  </div>

  <button class="btn btn-primary" id="convertBtn" onclick="convert()" disabled>
    開始轉換
  </button>

  <div class="progress" id="progress"><div class="fill"></div></div>
  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="card">
      <div class="card-title">轉換結果</div>
      <div class="stats">
        <div class="stat">
          <div class="val" id="charCount">0</div>
          <div class="lbl">字元數</div>
        </div>
        <div class="stat">
          <div class="val" id="lineCount">0</div>
          <div class="lbl">行數</div>
        </div>
      </div>
      <textarea id="output" readonly></textarea>
      <button class="btn btn-success" onclick="copyMd()">複製 Markdown</button>
      <button class="btn btn-secondary" onclick="saveMd()">儲存為 .md 檔案</button>
      <button class="btn btn-secondary" onclick="reset()">重新轉換</button>
    </div>
  </div>
</main>

<div class="toast" id="toast">已複製！</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let currentFile = null;
let currentMd = "";
let currentName = "";

const fileInput = document.getElementById("fileInput");

fileInput.addEventListener("change", e => {
  if (e.target.files[0]) setFile(e.target.files[0]);
});

const dropZone = document.getElementById("dropZone");
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});

function setFile(file) {
  currentFile = file;
  document.getElementById("fileName").textContent = file.name;
  document.getElementById("fileInfo").style.display = "flex";
  document.getElementById("convertBtn").disabled = false;
  setStatus("");
}

function clearFile() {
  currentFile = null;
  fileInput.value = "";
  document.getElementById("fileInfo").style.display = "none";
  document.getElementById("convertBtn").disabled = true;
  setStatus("");
}

function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (type ? " " + type : "");
}

async function convert() {
  if (!currentFile) return;

  document.getElementById("convertBtn").disabled = true;
  document.getElementById("progress").style.display = "block";
  document.getElementById("result").style.display = "none";
  setStatus("轉換中，請稍候...");

  const ext = currentFile.name.split(".").pop().toLowerCase();

  try {
    let md = "";

    if (ext === "pdf") {
      md = await convertPDF(currentFile);
    } else if (ext === "docx") {
      md = await convertDOCX(currentFile);
    } else if (["txt", "md", "json", "xml"].includes(ext)) {
      md = await readText(currentFile);
    } else if (ext === "csv") {
      md = await convertCSV(currentFile);
    } else if (["html", "htm"].includes(ext)) {
      md = await convertHTML(currentFile);
    } else {
      throw new Error("不支援的格式：." + ext);
    }

    currentMd = md;
    currentName = currentFile.name.replace(/\.[^.]+$/, "");

    document.getElementById("output").value = md;
    document.getElementById("charCount").textContent = md.length.toLocaleString();
    document.getElementById("lineCount").textContent = md.split("\n").length.toLocaleString();
    document.getElementById("progress").style.display = "none";
    document.getElementById("result").style.display = "block";
    setStatus("轉換成功！", "success");
    document.getElementById("result").scrollIntoView({ behavior: "smooth" });

  } catch (e) {
    document.getElementById("progress").style.display = "none";
    setStatus(e.message, "error");
    document.getElementById("convertBtn").disabled = false;
  }
}

async function convertPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const text = content.items.map(item => item.str).join(" ").trim();
    if (text) pages.push(`## 第 ${i} 頁\n\n${text}`);
  }
  return pages.join("\n\n---\n\n");
}

async function convertDOCX(file) {
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.convertToMarkdown({ arrayBuffer });
  return result.value;
}

async function readText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error("無法讀取檔案"));
    reader.readAsText(file, "UTF-8");
  });
}

async function convertCSV(file) {
  const text = await readText(file);
  const lines = text.trim().split("\n");
  if (!lines.length) return "";
  const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
  let md = "| " + headers.join(" | ") + " |\n";
  md += "| " + headers.map(() => "---").join(" | ") + " |\n";
  for (const line of lines.slice(1)) {
    const cells = line.split(",").map(c => c.trim().replace(/^"|"$/g, ""));
    md += "| " + cells.join(" | ") + " |\n";
  }
  return md;
}

async function convertHTML(file) {
  const text = await readText(file);
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, "text/html");
  return htmlToMd(doc.body);
}

function htmlToMd(node, depth = 0) {
  if (!node) return "";
  if (node.nodeType === 3) return node.textContent;
  const tag = node.tagName ? node.tagName.toLowerCase() : "";
  const inner = () => Array.from(node.childNodes).map(n => htmlToMd(n, depth)).join("");

  if (["script", "style", "nav", "header", "footer"].includes(tag)) return "";
  if (tag === "h1") return `# ${inner()}\n\n`;
  if (tag === "h2") return `## ${inner()}\n\n`;
  if (tag === "h3") return `### ${inner()}\n\n`;
  if (tag === "h4") return `#### ${inner()}\n\n`;
  if (["p", "div", "section", "article"].includes(tag)) {
    const t = inner().trim();
    return t ? `${t}\n\n` : "";
  }
  if (tag === "br") return "\n";
  if (tag === "strong" || tag === "b") return `**${inner()}**`;
  if (tag === "em" || tag === "i") return `*${inner()}*`;
  if (tag === "a") return `[${inner()}](${node.getAttribute("href") || ""})`;
  if (tag === "img") return `![${node.getAttribute("alt") || ""}](${node.getAttribute("src") || ""})`;
  if (tag === "li") return `- ${inner()}\n`;
  if (["ul", "ol"].includes(tag)) return `${inner()}\n`;
  if (tag === "code") return `\`${inner()}\``;
  if (tag === "pre") return `\`\`\`\n${inner()}\n\`\`\`\n\n`;
  if (tag === "blockquote") return `> ${inner()}\n\n`;
  if (tag === "hr") return "---\n\n";
  return inner();
}

function copyMd() {
  navigator.clipboard.writeText(currentMd).then(() => showToast("已複製！"));
}

function saveMd() {
  const blob = new Blob([currentMd], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = currentName + ".md";
  a.click();
  URL.revokeObjectURL(url);
}

function reset() {
  clearFile();
  document.getElementById("result").style.display = "none";
  setStatus("");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
</script>

</body>
</html>
